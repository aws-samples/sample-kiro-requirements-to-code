# PR Completeness Review — adapted from templates/workflows/pr-completeness-review.template.yml
# Posts an advisory completeness checklist on story/* PRs.
# NOT a required check — advisory only.
# REQUIRES: nothing (stdlib Python only, no secrets).

name: PR Completeness Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-completeness-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  completeness:
    name: completeness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.head_ref, 'story/')

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin "$BASE_REF" || true
          if ! git diff --name-only "origin/${BASE_REF}...HEAD" > changed-files.txt 2>/dev/null; then
            : > changed-files.txt
          fi

      - name: Build completeness report
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          SPECS_DIR: .kiro/specs
          CHANGED_FILES: changed-files.txt
          REPORT_PATH: pr-comment.md
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import os, re
          from pathlib import Path

          FRONT_MATTER = re.compile(r"\A---\r?\n(.*?)\r?\n---", re.DOTALL)
          BARE_REF = re.compile(r"\b([A-Z]{1,3}[0-9]{1,3})\b")
          CHECKBOX = re.compile(r"^\s*-\s*\[([ x~])\]", re.MULTILINE)
          IMPL_HEADING = re.compile(r"^##\s+Implementation Tasks\s*$", re.MULTILINE)
          AC_HEADING = re.compile(r"^##\s+Acceptance Criteria\s*$", re.MULTILINE)
          NEXT_HEADING = re.compile(r"^##\s+", re.MULTILINE)
          GIVEN = re.compile(r"\*\*Given\*\*", re.IGNORECASE)
          DONE_STATES = {"done", "closed"}

          def front_matter(text):
              match = FRONT_MATTER.search(text)
              if not match: return {}
              fields = {}
              for line in match.group(1).splitlines():
                  line = line.split("#", 1)[0].rstrip()
                  if ":" not in line or line.lstrip().startswith("#"): continue
                  key, _, value = line.partition(":")
                  fields[key.strip()] = value.strip().strip('"')
              return fields

          def section(text, heading):
              match = heading.search(text)
              if not match: return ""
              rest = text[match.end():]
              nxt = NEXT_HEADING.search(rest)
              return rest[:nxt.start()] if nxt else rest

          def find_story(specs_dir, refs):
              for path in sorted(specs_dir.glob("**/stories/*.md")):
                  if path.name.upper() == "README.MD": continue
                  text = path.read_text(encoding="utf-8")
                  fields = front_matter(text)
                  ref = fields.get("ref", "").strip().upper()
                  if ref and ref in refs: return path, fields, text
              return None, {}, ""

          def tick(ok):
              return {True: "- [x]", False: "- [ ]", None: "- [ ]"}[ok]

          title = os.environ.get("PR_TITLE") or ""
          body = os.environ.get("PR_BODY") or ""
          branch = os.environ.get("PR_BRANCH") or ""
          specs_dir = Path(os.environ.get("SPECS_DIR") or ".kiro/specs")
          report_path = Path(os.environ.get("REPORT_PATH") or "pr-comment.md")
          changed_path = Path(os.environ.get("CHANGED_FILES") or "changed-files.txt")
          changed = [l.strip() for l in changed_path.read_text(encoding="utf-8").splitlines() if l.strip()] if changed_path.is_file() else []

          refs = list(dict.fromkeys(BARE_REF.findall(branch.upper()) + BARE_REF.findall(title) + BARE_REF.findall(body)))
          lines = ["<!-- kiro:completeness -->", "## Story completeness checklist", ""]

          story_path, fields, text = find_story(specs_dir, refs) if specs_dir.is_dir() else (None, {}, "")
          if not story_path:
              lines += [f"**No story file found** for refs: {', '.join(refs) if refs else '(none)'}.", "",
                        "Add `Story: A1` to the PR description or use a `story/<ref>-<slug>` branch."]
              report_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          else:
              ref = fields.get("ref", "?")
              state = (fields.get("state") or "?").strip()
              tracker = (fields.get("trackerId") or "missing").strip()
              boxes = CHECKBOX.findall(section(text, IMPL_HEADING) or "")
              total, checked = len(boxes), sum(1 for b in boxes if b == "x")
              tasks_complete = total > 0 and checked == total
              ac_count = len(GIVEN.findall(section(text, AC_HEADING) or ""))
              state_is_done = state.lower() in DONE_STATES
              state_agrees = (state_is_done == tasks_complete) if total else None
              adr_touched = [f for f in changed if "docs/decisions/" in f]
              feature_dir = story_path.parent.parent.as_posix()
              design_touched = [f for f in changed if f.startswith(feature_dir) and f.endswith("design.md")]
              tests_touched = [f for f in changed if re.search(r"(^|/)tests?/|(^|/)test_[^/]+\.py$", f)]

              lines += [
                  f"**Story {ref}** — {fields.get('title', story_path.stem)}", "",
                  "| Field | Value |", "| --- | --- |",
                  f"| File | `{story_path}` |", f"| State | {state} |",
                  f"| Tracker ID | {tracker} |",
                  f"| Sprint / owner | {fields.get('sprint', '-')} / {fields.get('owner', '-')} |",
                  "", "### Mechanically checked", "",
                  f"{tick(tasks_complete)} All implementation tasks checked ({checked}/{total})",
                  f"{tick(state_agrees)} Story state (`{state}`) agrees with task checkboxes",
                  f"{tick(bool(adr_touched)) if adr_touched or design_touched else tick(None)} ADR present" + (f" ({', '.join(adr_touched)})" if adr_touched else " — none detected"),
                  f"{tick(bool(tests_touched))} Test files touched" + (f" ({len(tests_touched)})" if tests_touched else " — none detected"),
                  "", "### Needs a human", "",
                  f"- [ ] All {ac_count} acceptance criteria are actually met (this workflow counted them, not evaluated them).",
                  "- [ ] Checked boxes reflect work that exists — a checkbox is a claim, not evidence.",
                  "- [ ] Implementation matches design, or deviation is recorded in `work-item-map.yaml`.",
                  "- [ ] Tests are meaningful, not just present.",
                  "", "---",
                  "_Advisory. Blocking gates: spec-integrity, work-item-link-check, code-quality, terraform-plan._",
              ]
              report_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(report_path.read_text(encoding="utf-8"))
          PY

      - name: Post checklist as PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kiro:completeness -->';
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
