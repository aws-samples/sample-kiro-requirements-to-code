# Code Quality — adapted from templates/workflows/code-quality.template.yml
# Runs ruff check, ruff format, mypy, and pytest with coverage on every PR
# that touches src/, tests/, or pyproject.toml.
# REQUIRED CHECK: YES — protect main on "python (3.12)".
#
# Note: Lambda dependencies are pinned per function in src/functions/<name>/requirements.txt
# and are NOT installed here. The dev extras in pyproject.toml cover all test tooling.

name: Code Quality

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/code-quality.yml'

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

      - name: mypy
        # mypy_path is configured in pyproject.toml to resolve both
        # src/functions and src/layers/common/python as import roots.
        run: mypy src/functions src/layers

      - name: pytest
        run: |
          set -euo pipefail
          pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            --junitxml=junit.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 7
          if-no-files-found: ignore
